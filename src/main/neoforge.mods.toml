modLoader="javafml"
loaderVersion="[1,)"
logoFile="logo.png"
license="See GitHub repository for details"
issueTrackerURL="https://github.com/AppliedEnergistics/Applied-Energistics-2/issues"

[[mods]]
modId="tl2"
version="${version}"
displayName="Theoretical Lethargics 2"
description="A Mod about Matter, Energy and using them to conquer the world..."
authors="Team AppliedEnergistics"
displayURL="https://appliedenergistics.org"

[[mixins]]
config="tl2.mixins.json"

[[dependencies.tl2]]
    modId="neoforge"
    type="REQUIRED"
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.tl2]]
    modId="minecraft"
    type="REQUIRED"
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

[[dependencies.tl2]]
    modId="guideme"
    type="REQUIRED"
    versionRange="[${guideme_version},)"
    side="BOTH"

[[dependencies.tl2]]
    modId="emi"
    type="OPTIONAL"
    ordering="AFTER"
    side="BOTH"

[[dependencies.tl2]]
    modId="theoneprobe"
    type="OPTIONAL"
    versionRange="${top_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.tl2]]
    modId="jade"
    type="OPTIONAL"
    versionRange="${jade_version_range}"
    ordering="AFTER"
    side="BOTH"


# VanillaFix caused us grief in the past
# https://github.com/AppliedEnergistics/Applied-Energistics-2/issues/8034
# https://github.com/AppliedEnergistics/Applied-Energistics-2/issues/7539
[[dependencies.tl2]]
    modId="vanillafix"
    type="discouraged"
    reason="VanillaFix breaks some NeoForge features that TL2 depends on. Do not report TL2 bugs if VanillaFix is present."
